{% extends "base.html" %}
{% block title %}用户 {{ user.username }} · 后台{% endblock %}
{% block content %}
<section class="hero">
  <h1>用户详情</h1>
  <p>
    <a href="{{ url_for('admin.users') }}">← 用户列表</a>
    · <a href="{{ url_for('admin.user_edit', user_id=user.id) }}">编辑</a>
  </p>
</section>
<section class="card">
  <dl class="kv">
    <dt>ID</dt><dd>{{ user.id }}</dd>
    <dt>用户名</dt><dd>{{ user.username }}</dd>
    <dt>管理员</dt><dd>{% if user.is_admin %}是{% else %}否{% endif %}</dd>
    <dt>注册时间</dt><dd>{{ user.created_at }}</dd>
  </dl>
</section>
{% endblock %}
