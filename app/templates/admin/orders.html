{% extends "base.html" %}
{% block title %}订单管理{% endblock %}
{% block content %}
<section class="hero">
  <h1>订单管理</h1>
  <p><a href="{{ url_for('admin.dashboard') }}">← 后台</a></p>
</section>
<section class="card">
  <table class="data-table">
    <thead><tr><th>ID</th><th>用户</th><th>状态</th><th>金额</th><th>时间</th></tr></thead>
    <tbody>
    {% for o in orders %}
      <tr>
        <td><a href="{{ url_for('admin_orders.order_detail', oid=o.id) }}">#{{ o.id }}</a></td>
        <td>{{ o.user_id }}</td>
        <td>{{ o.status }}</td>
        <td>¥ {{ o.total_amount }}</td>
        <td class="muted">{{ o.created_at }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5" class="muted">暂无订单</td></tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
