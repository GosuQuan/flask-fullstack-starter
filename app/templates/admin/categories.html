{% extends "base.html" %}
{% block title %}类目管理{% endblock %}
{% block content %}
<section class="hero">
  <h1>类目管理</h1>
  <p><a href="{{ url_for('admin.dashboard') }}">← 后台</a> · <a href="{{ url_for('admin_catalog.category_new') }}">新建类目</a></p>
</section>
<section class="card">
  <table class="data-table">
    <thead><tr><th>ID</th><th>名称</th><th>Slug</th><th>排序</th><th></th></tr></thead>
    <tbody>
    {% for c in categories %}
      <tr>
        <td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.slug }}</td><td>{{ c.sort_order }}</td>
        <td class="actions">
          <a href="{{ url_for('admin_catalog.category_edit', cid=c.id) }}">编辑</a>
          <form method="post" action="{{ url_for('admin_catalog.category_delete', cid=c.id) }}" class="inline-form" onsubmit="return confirm('删除？');">
            <button type="submit" class="btn-danger">删除</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
