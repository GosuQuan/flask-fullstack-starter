{% extends "base.html" %}
{% block title %}注册 · Flask Fullstack{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>注册</h2>
  <form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
    <label>
      用户名
      <input type="text" name="username" required minlength="3" maxlength="64" autocomplete="username" autofocus />
    </label>
    <label>
      密码（至少 6 位）
      <input type="password" name="password" required minlength="6" autocomplete="new-password" />
    </label>
    <label>
      确认密码
      <input type="password" name="password2" required minlength="6" autocomplete="new-password" />
    </label>
    <button type="submit">注册</button>
  </form>
  <p class="form-footer">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</section>
{% endblock %}
