name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff (lint)
        run: ruff check app tests scripts --select E,F --ignore E501 || true

      - name: Pytest
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/ci_missing
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -q
